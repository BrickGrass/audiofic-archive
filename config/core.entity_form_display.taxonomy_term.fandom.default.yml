        description: "Put the full name of the new fandom here.<br /><br />For consistency when adding new fandoms, copy the fandom name from AO3 and paste it in. You can use non-English characters &/or the Romanized original language plus an English version of the fandom if that exists, separated by \"|\"  e.g. doragon bōru | dragon ball, 陈情令 | The Untamed (tv). Wikipedia is a source for the most common Romanizations. \r\n<br /><br />\r\nPlease avoid meta-tags for fandoms if at all possible, as these make searching difficult. e.g. use captain america (movies), &/or captain america (comics) rather than captain america (all media types). For a new fandom where only one media type exists, it helps to add the media type in parentheses in case there are later adaptations in different media. e.g. Vespertine (book) allows for the possibility that a movie or tv show might later be made, so searches can be more accurate."
