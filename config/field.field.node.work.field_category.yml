label: Category
description: "<br />More details about the categories:  <span id=\"category\" class=\"expand-help-hide\">\r\n<p><b>gen:</b> Used for works that have no relationship focus at all, or where the primary focus is a relationship that is not romantic or sexual. A non-romantic/sexual relationship could be a friendship, a familial bond or some queerplatonic relationships</p>\r\n<p><b>f/f:</b> Female-female romantic and/or sexual relationship</p>\r\n<p><b>f/m:</b> Female-male romantic and/or sexual relationship</p>\r\n<p><b>m/m:</b> Male-male romantic and/or sexual relationship</p>\r\n<p><b>nb/any:</b> Romantic and/or sexual relationship between a nonbinary character (all identities under the nonbinary umbrella, and adjacent) and another character of any gender</p>\r\n<p><b>poly:</b> Polyamorous romantic and/or sexual relationship (<a href=\"https://en.wikipedia.org/wiki/Polyamory\">info here</a>)</p>\r\n<p><b>other:</b> Can be used if the romantic and/or sexual relationship is in a different category to those above. A few examples are: with a non-human alien, a monster, or for inanimate object crackfics</p>\r\n</span>\r\n<a href=\"#\" role=\"button\" aria-label=\"Expand/Collapse help text\" class=\"expand-help-button\" data-for=\"category\">Read More</a>"
