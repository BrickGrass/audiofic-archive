description: "<br />More details about how to rate podfics:  <span id=\"rating\" class=\"expand-help-hide\">\r\n<p><b>Explicit: </b>Contains explicit depictions of sex, or graphic violence etc.</p>\r\n<p><b>Mature: </b>Contains adult themes (sex, violence, etc.) that are not as graphic as explicit-rated content. A great explanation of the difference is <a href=\"https://tinsnip.tumblr.com/post/94902447909/okay-so-im-actually-about-to-write-a-porn-fic\">here</a></p>\r\n<p><b>Teen and up: </b>Content may be inappropriate for audiences under 13</p>\r\n<p><b>General: </b>Content is suitable for any age group</p>\r\n<p><b>Not rated: </b>Can be used if the author gave no rating. You might want to rate the work yourself, but if not, use this category</p></span>\r\n<a href=\"#\" role=\"button\" aria-label=\"Expand/Collapse help text\" class=\"expand-help-button\" data-for=\"rating\">Read More</a>\r\n"
