label: Warning
description: "<br />More details about the warnings: <span id=\"warnings\" class=\"expand-help-hide\"><p>\r\n<b>No Archive Warnings Apply:</b> This is used if none of the Archive warnings below apply to your work.\r\n<p></p>\r\n<b>Graphic Depictions Of Violence:</b> This is for gory, graphic, explicitly described violence. Exactly where to draw the line is your call, but <a href=\"https://ao3commentoftheday.tumblr.com/post/751936141205405696/how-to-figure-out-if-you-need-to-use-the-graphic\">this description</a> may help.\r\n<p></p>\r\n<b>Major Character Death:</b> This is used when a major character in the work dies irreversibly. Use your best judgment about who counts as a major character. The warning is not needed for temporary or mistaken situations where the supposed death of a major character turns out not to have occurred or is somehow reversed.\r\n<p></p>\r\n<b>Rape or Non-Con:</b> This is for content containing non-consensual sexual activity. It should be used for all types and degrees of non-consensual sexual activity including verbal and tactile.\r\n<p></p>\r\n<b>Underage:</b> This is for content depicting any type of sexual activity involving any character under age 18. Use your judgement - it doesn't include dating activity like kissing, or vague references with no actual depiction. This warning generally applies to humans. If your work is about aliens who only live for a month or 1000 year old vampires with 12 year old bodies, use your best judgment - you can explain nuances in the Notes field.\r\n<p></p>\r\n<b>Creator chooses not to warn, so any or all warnings may apply:</b> This is used if you don't want to warn for anything. You might choose this option if you don't like warning for certain topics or dislike warnings in general, if you want to avoid spoilers, or if you aren't sure if one of the major warnings applies.</p>\r\n</span>\r\n<a href=\"#\" role=\"button\" aria-label=\"Expand/Collapse help text\" class=\"expand-help-button\" data-for=\"warnings\">Read More</a>\r\n"
