        id: register-form-more-info
        label_as_html: true
        open: false
        description: "<p>Submitting this form will add you to a queue of users to be manually verified by our moderators. Don't worry - we don't bite! Because we allow users to host images, audio files and zip files we want to be extra sure that noone trying to spam gets access to the site, so that anyone browsing is protected from malware.</p>\r\n\r\n<p>We will contact you via the email you have provided as soon as possible and ask some really basic questions. If you already have podfics hosted with us (from the previous iteration of the site where you had moderators upload podfics for you) we will ask you to complete a verification process to be sure you are a specific podficcer, and give you edit access to all of your existing posts if you can prove this!</p>\r\n\r\n<p>The verification process is not at all about the contents or topic of the podfic you post - that's between you and your listeners!</p>"
        required_fields: false
