description: "You can group your works together in reader collections. Each work can be in multiple collections.<br /><br /><b>Create the collection first, before adding a work to it</b> by going to 'post' on the main menu.<br /><br />The works in a reader collection will be listed according to how recently you added them. Where you have a compilation, like an anthology of several podfics in one mp3, that will be at the top as long as you tag that file with 'compilation'. The separate works making up the compilation will then be listed below. e.g. this may be useful for festival anthologies."
