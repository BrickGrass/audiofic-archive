id: aa_d7_taxonomy_term_time
label: Drupal 7 Taxonomy Term Time/Length
migration_tags:
  - 'Drupal 7'
  - 'Audiofic Archive'
source:
  key: migrate
  plugin: d7_taxonomy_term
  bundle: vocabulary_3
  constants:
    vid: 'length'
process:
  tid: tid
  revision_id: tid
  vid: constants/vid
  # Remove language| prefix
  name:
    plugin: substr
    source: name
    start: 5
  'description/value': description
  'description/format': format
  weight: weight
  parent_id:
    plugin: skip_on_empty
    method: process
    source: parent
  parent:
    plugin: default_value
    default_value: 0
    source: '@parent_id'
  changed: timestamp
  langcode: language
destination:
  plugin: entity:taxonomy_term
migration_dependencies:
  required: { }
  optional: { }