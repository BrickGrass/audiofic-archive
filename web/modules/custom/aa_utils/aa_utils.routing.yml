aa_utils.delete_attribution:
  path: node/{node}/user/{user}/delete
  defaults:
    _form: \Drupal\aa_utils\Form\ConfirmDeleteAttributionForm
  requirements:
    _custom_access: '\Drupal\aa_utils\Form\ConfirmDeleteAttributionForm::access'
  options:
    _admin_route: TRUE
    parameters:
      user:
        type: entity:user
      node:
        type: entity:node

aa_utils.fandom_index:
  path: fandoms
  defaults:
    _controller: \Drupal\aa_utils\Controller\FandomIndexController::fandomIndex
    _title: Browse All Fandoms
  requirements:
    _access: 'TRUE'

aa_utils.fandom_page:
  path: fandoms/{taxonomy_term}
  defaults:
    _controller: \Drupal\aa_utils\Controller\FandomIndexController::fandomPage
    _title_callback: \Drupal\aa_utils\Controller\FandomIndexController::fandomPageTitle
  requirements:
    _access: 'TRUE'
  options:
    parameters:
      taxonomy_term:
        type: entity:taxonomy_term