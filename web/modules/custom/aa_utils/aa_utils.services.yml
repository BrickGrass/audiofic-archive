services:
  aa_utils.utils:
    class: Drupal\aa_utils\Service\AudioficUtils
  aa_utils.tag_utils:
    class: Drupal\aa_utils\Service\AudioficTagUtils
    arguments: ['@entity_type.manager']

  Drupal\aa_utils\Service\AudioficUtils:
    alias: 'aa_utils.utils'
  Drupal\aa_utils\Service\AudioficTagUtils:
    alias: 'aa_utils.tag_utils'

  aa_utils.user_route_context:
    class: Drupal\aa_utils\ContextProvider\UserRouteContext
    arguments: ['@current_route_match']
    tags:
      - { name: 'context_provider' }
