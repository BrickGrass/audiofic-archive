entity.abrconfig.collection:
  path: '/admin/config/content/access_by_ref'
  defaults:
    _entity_list: 'abrconfig'
    _title: 'Access by reference configuration'
  requirements:
    _permission: 'administer access_by_ref settings'

entity.abrconfig.add_form:
  path: '/admin/config/content/access_by_ref/add'
  defaults:
    _entity_form: 'abrconfig.add'
    _title: 'Add abr configuration'
  requirements:
    _permission: 'administer access_by_ref settings'

entity.abrconfig.edit_form:
  path: '/admin/config/content/access_by_ref/{abrconfig}'
  defaults:
    _entity_form: 'abrconfig.edit'
    _title: 'Edit abr configuration'
  requirements:
    _permission: 'administer access_by_ref settings'

entity.abrconfig.delete_form:
  path: '/admin/config/content/access_by_ref/{abrconfig}/delete'
  defaults:
    _entity_form: 'abrconfig.delete'
    _title: 'Delete abr configuration'
  requirements:
    _permission: 'administer access_by_ref settings'
