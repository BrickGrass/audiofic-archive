        <bpmn2:extensionElements>
          <camunda:properties>
            <camunda:property name="pluginid" value="eca_endpoint:access"/>
          </camunda:properties>
          <camunda:field name="first_path_argument">
            <camunda:string>savedsearch</camunda:string>
          </camunda:field>
          <camunda:field name="second_path_argument">
            <camunda:string/>
