label: Language
description: "Use this to specify the language of your recording. The default value is English - delete the default text to locate a different language. You can only select languages that are already in the Archive. When searching for the language you want, just enter a few characters and options will appear. You can enter English versions of language names or the original language, including non-English characters. e.g. entering \"ko\" will bring up Korean, as will entering 한 . Before you decide that the language you want isn't in the Archive, search on the English version of its name, just to be sure. \r\n<br /><br />\r\nTo add a new language, go to the main menu and use \"add tags\", then return here. You can also save your work with English as the language, then edit it a bit later after you've added the new language that you need. "
